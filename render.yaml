# Blueprint Render — déploiement 1-clic du backend FastAPI
# Sur render.com : New → Blueprint → sélectionner ce repo.
services:
  - type: web
    name: sahel-commerce-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://sahel-commerce-ai.vercel.app,http://localhost:3000
      - key: ANTHROPIC_API_KEY
        sync: false # à saisir dans le dashboard Render (jamais dans le code)
