name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur une PR annule le run précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      # Aucune clé d'API n'est fournie : l'agent bascule en mode démo, ce qui
      # est exactement ce qu'on veut tester ici — la limite de débit doit
      # s'appliquer avant même que le modèle soit appelé.
      - name: Tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
